name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # tsdown needs Node 22.18 or newer, so build on 24 and run the result on the matrix version.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node dist/index.mjs --version
      - run: node dist/index.mjs init --brand "#4f46e5" --project "$RUNNER_TEMP" && node dist/index.mjs audit --project "$RUNNER_TEMP"
      - run: node dist/index.mjs emit css tailwind shadcn scss ts dtcg design-md preview --project "$RUNNER_TEMP" && test -s "$RUNNER_TEMP/kaava/shadcn.css" && npx --yes @google/design.md lint "$RUNNER_TEMP/kaava/DESIGN.md"
