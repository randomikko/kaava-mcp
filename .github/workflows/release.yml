name: Release

# Publishes to npm when a version tag (v0.1.0) is pushed.
# Requires npm trusted publishing to be configured for this repository on npmjs.com
# (package settings -> Trusted Publisher -> GitHub Actions, workflow "release.yml").
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
